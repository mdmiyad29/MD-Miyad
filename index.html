<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MD Miyad Premium Profile</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:radial-gradient(circle at top,#0f172a,#020617,#000);
    overflow:hidden;
    color:white;
}

@keyframes glow{
    0%{box-shadow:0 0 20px rgba(0,255,255,0.2);}
    50%{box-shadow:0 0 50px rgba(0,255,255,0.6);}
    100%{box-shadow:0 0 20px rgba(0,255,255,0.2);}
}

@keyframes float{
    0%{transform:translateY(0px);}
    50%{transform:translateY(-10px);}
    100%{transform:translateY(0px);}
}

.card{
    width:90%;
    max-width:430px;
    padding:30px;
    border-radius:25px;
    background:rgba(255,255,255,0.07);
    border:1px solid rgba(255,255,255,0.1);
    backdrop-filter:blur(10px);
    text-align:center;
    position:relative;
    animation:glow 3s infinite ease-in-out;
}

.profile{
    width:160px;
    height:160px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid #00ffff;
    margin-bottom:20px;
    animation:float 4s infinite ease-in-out;
}

h1{
    color:#00ffff;
    margin-bottom:10px;
    font-size:32px;
}

.tag{
    display:inline-block;
    background:#00ffff;
    color:black;
    padding:8px 18px;
    border-radius:30px;
    font-weight:bold;
    margin-bottom:20px;
}

.about{
    background:rgba(255,255,255,0.05);
    padding:18px;
    border-radius:15px;
    line-height:1.8;
    color:#e5e7eb;
    margin-bottom:20px;
}

.info{
    text-align:left;
    background:rgba(255,255,255,0.05);
    padding:18px;
    border-radius:15px;
    line-height:2;
}

a{
    color:#00ffff;
    text-decoration:none;
}

.circle{
    position:absolute;
    border-radius:50%;
    background:rgba(0,255,255,0.15);
    animation:float 8s infinite ease-in-out;
}

.c1{
    width:120px;
    height:120px;
    top:-40px;
    right:-30px;
}

.c2{
    width:90px;
    height:90px;
    bottom:-30px;
    left:-20px;
}
</style>
</head>

<body>

<div class="card">

<div class="circle c1"></div>
<div class="circle c2"></div>

<img class="profile" src="your-image.jpg" alt="MD Miyad">

<h1>MD MIYAD</h1>

<div class="tag">
Personal Premium Profile
</div>

<div class="about">
“একজন হেরে যাওয়া পুরুষ একজন হেরে যাওয়া নারীকে ভালোবাসতে চায় আর সেটাই আমি 😔”
</div>

<div class="info">
📍 Ullapara, Sirajganj <br>
🎓 ডাঃ সামস্ উদ্দিন সালেমা মেমোরিয়াল কলেজ <br>
🎮 Free Fire UID: 7047411181 <br>
💙 ভালোবাসা, অনুভূতি আর বাস্তব জীবন নিয়েই আমার গল্প <br><br>

🌐 Facebook:
<a href="https://www.facebook.com/profile.php?id=61586769009796" target="_blank">
Visit Profile
</a>
</div>

</div>

</body>
</html>
